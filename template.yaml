# The noop WorkflowTemplate — this repo IS the template's home (three-tier
# phase 3c, ADR-0011 amendment). The deterministic-only pipeline (no LLM
# agent, no validation gate) used for probes and smoke runs. spec.source
# (#787): the MR-bridge proposes against THIS file; signed pushes land as
# revision identity. No decision fields — nothing to decide.
apiVersion: harmostes.dev/v1alpha1
kind: WorkflowTemplate
metadata:
  name: noop
spec:
  source:
    forge: github
    repo: tibrezus/harmostes-template-noop
    path: template.yaml
    branch: main
    secretRef:
      name: harmostes-template-webhook
      key: secret
  description: Deterministic-only (no LLM agent, no validation gate)
  prepare:
    plugin:
      name: rig-emit
  agent:
    skill: ""
    gate:
      plugin:
        name: noop
  deploy:
    plugin:
      name: git-push
